kotlin.code.style=official

org.gradle.caching=true
org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.tooling.parallel=true

# Kotlin & KSP Incremental Build Optimization
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.daemon.jvmargs=-Xmx2g
ksp.incremental=true
ksp.incremental.intermodule=true

# Suppress Android Gradle Plugin compile SDK 37.1 compatibility warning
android.suppressUnsupportedCompileSdk=37.1

