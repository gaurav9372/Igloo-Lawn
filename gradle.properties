kotlin.code.style=official

org.gradle.caching=true
org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true

# Kotlin & KSP Incremental Build Optimization
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseG1GC
# KSP incremental enabled (Gradle cache and projects both on D: drive)
ksp.incremental=true

# Android Gradle Plugin Performance Flags
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=37.1

